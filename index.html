<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mango Painter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(#fff7d6, #ffe9b0);
  color: #49351f;
}

header {
  text-align: center;
  padding: 20px 10px 10px;
}

header h1 {
  margin: 0;
  font-size: 42px;
  color: #ef7d00;
}

header p {
  margin: 7px 0;
  font-size: 17px;
}

.app {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 18px;
}

.controls,
.canvasBox {
  background: rgba(255,255,255,0.9);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 8px 25px rgba(100,70,20,.15);
}

.controlGroup {
  margin-bottom: 20px;
}

.controlGroup h3 {
  margin: 0 0 9px;
  font-size: 16px;
}

.palette {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.swatch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid white;
  box-shadow: 0 0 0 1px #aaa;
  cursor: pointer;
}

.swatch.active {
  box-shadow: 0 0 0 4px #ffb347;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

button {
  border: 1px solid #e3c59a;
  background: white;
  border-radius: 10px;
  padding: 9px 11px;
  cursor: pointer;
  font-size: 14px;
}

button.active {
  background: #ffe0a3;
  border-color: #f0a42d;
}

button:hover {
  background: #fff0cf;
}

input[type="range"] {
  width: 100%;
}

input[type="color"] {
  width: 50px;
  height: 38px;
  border: none;
  background: none;
}

.actionButtons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.canvasBox {
  display: flex;
  align-items: center;
  justify-content: center;
}

.canvasWrap {
  width: 100%;
  max-width: 760px;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 15px;
  touch-action: none;
  background: white;
}

.tip {
  font-size: 13px;
  line-height: 1.4;
  color: #725c42;
}

@media (max-width: 800px) {

  header h1 {
    font-size: 34px;
  }

  .app {
    grid-template-columns: 1fr;
  }

  .controls {
    order: 2;
  }

  .canvasBox {
    order: 1;
  }
}
</style>
</head>

<body>

<header>
  <h1>🥭 Mango Painter</h1>
  <p>Create your own masterpiece — Mango Tango style!</p>
</header>

<div class="app">

<div class="controls">

  <div class="controlGroup">
    <h3>Colours</h3>

    <div id="palette" class="palette"></div>

    <div style="margin-top:10px;">
      Custom:
      <input id="colorPicker" type="color" value="#ff4f93">
    </div>
  </div>


  <div class="controlGroup">
    <h3>Tools</h3>

    <div class="tools">

      <button class="tool active" data-tool="brush">
        Brush
      </button>

      <button class="tool" data-tool="dots">
        Dots
      </button>

      <button class="tool" data-tool="stripe">
        Stripe
      </button>

      <button class="tool" data-tool="heart">
        Heart
      </button>

      <button class="tool" data-tool="flower">
        Flower
      </button>

      <button class="tool" data-tool="eraser">
        Eraser
      </button>

    </div>
  </div>


  <div class="controlGroup">

    <h3>
      Brush size:
      <span id="sizeLabel">9</span>
    </h3>

    <input
      id="size"
      type="range"
      min="3"
      max="35"
      value="9"
    >

  </div>


  <div class="controlGroup">

    <h3>Mango colour</h3>

    <input
      id="baseColor"
      type="color"
      value="#ffc928"
    >

  </div>


  <div class="controlGroup">

    <h3>Actions</h3>

    <div class="actionButtons">

      <button id="clearArt">
        Clear
      </button>

      <button id="fillMango">
        Fill Mango
      </button>

      <button id="surprise">
        Surprise Me
      </button>

      <button id="download">
        Download
      </button>

    </div>

  </div>

  <div class="tip">
    Paint directly on the mango using your mouse or finger.
    All painting stays inside the mango.
  </div>

</div>


<div class="canvasBox">

<div class="canvasWrap">

<canvas
  id="canvas"
  width="760"
  height="620">
</canvas>

</div>

</div>

</div>


<script>

(function () {

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");


const artCanvas =
  document.createElement("canvas");

artCanvas.width =
  canvas.width;

artCanvas.height =
  canvas.height;

const art =
  artCanvas.getContext("2d");


const paletteEl =
  document.getElementById("palette");

const colorPicker =
  document.getElementById("colorPicker");

const sizeInput =
  document.getElementById("size");

const sizeLabel =
  document.getElementById("sizeLabel");

const baseColor =
  document.getElementById("baseColor");


const W =
  canvas.width;

const H =
  canvas.height;


const palette = [

"#ff4057",
"#ff812b",
"#ffd52e",
"#74d34c",
"#35c6db",
"#448aff",
"#a56bdf",
"#ff72c6",
"#ffffff",
"#5d3927",
"#222222"

];


let currentColor =
  "#ff4057";

let currentTool =
  "brush";

let drawing =
  false;

let lastPoint =
  null;



/* --------------------------
   MANGO SHAPE
--------------------------- */

function mangoPath(context) {

  context.beginPath();

  context.moveTo(
    370,
    115
  );

  context.bezierCurveTo(
    485, 95,
    560, 185,
    550, 315
  );

  context.bezierCurveTo(
    540, 455,
    455, 540,
    335, 530
  );

  context.bezierCurveTo(
    220, 520,
    170, 420,
    205, 305
  );

  context.bezierCurveTo(
    235, 205,
    290, 135,
    370, 115
  );

  context.closePath();

}



function insideMango(x,y) {

  mangoPath(ctx);

  return ctx.isPointInPath(
    x,
    y
  );

}



/* --------------------------
   BACKGROUND
--------------------------- */

function drawBackground() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );


  sky.addColorStop(
    0,
    "#bfeaff"
  );

  sky.addColorStop(
    .58,
    "#fff6c8"
  );

  sky.addColorStop(
    1,
    "#dff2a4"
  );


  ctx.fillStyle =
    sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* sun */

  ctx.beginPath();

  ctx.arc(
    95,
    95,
    45,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ffe66b";

  ctx.fill();


  /* ground */

  ctx.fillStyle =
    "#7bc96f";

  ctx.fillRect(
    0,
    H - 85,
    W,
    85
  );


  /* palm tree */

  ctx.strokeStyle =
    "#8a552e";

  ctx.lineWidth =
    14;

  ctx.beginPath();

  ctx.moveTo(
    660,
    535
  );

  ctx.quadraticCurveTo(
    645,
    410,
    670,
    310
  );

  ctx.stroke();


  ctx.fillStyle =
    "#36a852";


  for(
    let i = 0;
    i < 6;
    i++
  ){

    const angle =
      i * Math.PI / 3;

    ctx.beginPath();

    ctx.ellipse(
      670 +
      Math.cos(angle) * 42,

      300 +
      Math.sin(angle) * 20,

      52,
      15,

      angle,

      0,
      Math.PI * 2
    );

    ctx.fill();

  }

}



/* --------------------------
   MANGO BASE
--------------------------- */

function drawMangoBase() {

  mangoPath(ctx);

  ctx.fillStyle =
    baseColor.value;

  ctx.fill();


  const gradient =
    ctx.createLinearGradient(
      220,
      160,
      520,
      480
    );


  gradient.addColorStop(
    0,
    "rgba(255,255,255,.45)"
  );

  gradient.addColorStop(
    .55,
    "rgba(255,255,255,.03)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,90,0,.18)"
  );


  ctx.fillStyle =
    gradient;

  ctx.fill();


  /* leaf */

  ctx.beginPath();

  ctx.ellipse(
    390,
    98,
    55,
    20,
    -.45,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#46a847";

  ctx.fill();


  redrawOutline();

}



function redrawOutline() {

  mangoPath(ctx);

  ctx.strokeStyle =
    "rgba(80,65,30,.45)";

  ctx.lineWidth =
    4;

  ctx.stroke();

}



/* --------------------------
   RENDER
--------------------------- */

function render() {

  drawBackground();

  drawMangoBase();

  ctx.drawImage(
    artCanvas,
    0,
    0
  );

  redrawOutline();

}



/* --------------------------
   DRAWING CLIP
--------------------------- */

function clipMango() {

  art.save();

  mangoPath(art);

  art.clip();

}


function unclipMango() {

  art.restore();

}



/* --------------------------
   POINTER POSITION
--------------------------- */

function getPoint(e) {

  const rect =
    canvas.getBoundingClientRect();


  const source =
    e.touches
    ? e.touches[0]
    : e;


  return {

    x:
      (source.clientX -
      rect.left)
      *
      (W /
      rect.width),

    y:
      (source.clientY -
      rect.top)
      *
      (H /
      rect.height)

  };

}



function size() {

  return Number(
    sizeInput.value
  );

}



/* --------------------------
   COLOUR + TOOL
--------------------------- */

function setColor(color) {

  currentColor =
    color;

  colorPicker.value =
    color;


  document
    .querySelectorAll(
      ".swatch"
    )
    .forEach(el => {

      el.classList.toggle(
        "active",
        el.dataset.color
        === color
      );

    });

}



function setTool(tool) {

  currentTool =
    tool;


  document
    .querySelectorAll(
      ".tool"
    )
    .forEach(el => {

      el.classList.toggle(
        "active",
        el.dataset.tool
        === tool
      );

    });

}



/* --------------------------
   BRUSH
--------------------------- */

function drawLine(
  a,
  b,
  erase
) {

  clipMango();


  art.globalCompositeOperation =
    erase
    ? "destination-out"
    : "source-over";


  art.strokeStyle =
    currentColor;

  art.lineWidth =
    size();

  art.lineCap =
    "round";

  art.lineJoin =
    "round";


  art.beginPath();

  art.moveTo(
    a.x,
    a.y
  );

  art.lineTo(
    b.x,
    b.y
  );

  art.stroke();


  art.globalCompositeOperation =
    "source-over";


  unclipMango();

  render();

}



/* --------------------------
   DOT
--------------------------- */

function drawDot(x,y) {

  clipMango();

  art.fillStyle =
    currentColor;

  art.beginPath();

  art.arc(
    x,
    y,
    size(),
    0,
    Math.PI * 2
  );

  art.fill();

  unclipMango();

  render();

}



/* --------------------------
   STRIPE
--------------------------- */

function drawStripe(y) {

  clipMango();

  art.strokeStyle =
    currentColor;

  art.lineWidth =
    size() * 1.8;

  art.beginPath();

  art.moveTo(
    160,
    y
  );

  art.quadraticCurveTo(
    370,
    y - 15,
    570,
    y
  );

  art.stroke();

  unclipMango();

  render();

}



/* --------------------------
   HEART
--------------------------- */

function drawHeart(x,y) {

  clipMango();

  const s =
    size() * 1.5;


  art.save();

  art.translate(
    x,
    y
  );


  art.beginPath();

  art.moveTo(
    0,
    s
  );


  art.bezierCurveTo(
    s * 1.2,
    0,

    s * .8,
    -s,

    0,
    -s * .45
  );


  art.bezierCurveTo(
    -s * .8,
    -s,

    -s * 1.2,
    0,

    0,
    s
  );


  art.fillStyle =
    currentColor;

  art.fill();


  art.restore();

  unclipMango();

  render();

}



/* --------------------------
   FLOWER
--------------------------- */

function drawFlower(x,y) {

  clipMango();


  const r =
    size() * .7;


  for(
    let i = 0;
    i < 6;
    i++
  ){

    const a =
      Math.PI * 2 *
      i / 6;


    art.beginPath();


    art.arc(

      x +
      Math.cos(a)
      * r * 1.8,

      y +
      Math.sin(a)
      * r * 1.8,

      r,

      0,
      Math.PI * 2

    );


    art.fillStyle =
      currentColor;

    art.fill();

  }


  art.beginPath();

  art.arc(
    x,
    y,
    r,
    0,
    Math.PI * 2
  );

  art.fillStyle =
    "#ffd52e";

  art.fill();


  unclipMango();

  render();

}



/* --------------------------
   START DRAWING
--------------------------- */

function startDrawing(p) {

  if(
    !insideMango(
      p.x,
      p.y
    )
  )
    return;


  drawing =
    true;

  lastPoint =
    p;


  if(
    currentTool
    === "brush"
  )

    drawLine(
      p,
      p,
      false
    );


  else if(
    currentTool
    === "eraser"
  )

    drawLine(
      p,
      p,
      true
    );


  else if(
    currentTool
    === "dots"
  )

    drawDot(
      p.x,
      p.y
    );


  else if(
    currentTool
    === "stripe"
  )

    drawStripe(
      p.y
    );


  else if(
    currentTool
    === "heart"
  )

    drawHeart(
      p.x,
      p.y
    );


  else if(
    currentTool
    === "flower"
  )

    drawFlower(
      p.x,
      p.y
    );

}



/* --------------------------
   MOVE DRAWING
--------------------------- */

function moveDrawing(p) {

  if(
    !drawing
  )
    return;


  if(
    currentTool
    === "brush"
  )

    drawLine(
      lastPoint,
      p,
      false
    );


  else if(
    currentTool
    === "eraser"
  )

    drawLine(
      lastPoint,
      p,
      true
    );


  else if(
    currentTool
    === "dots"
    &&
    insideMango(
      p.x,
      p.y
    )
  )

    drawDot(
      p.x,
      p.y
    );


  lastPoint =
    p;

}



function endDrawing() {

  drawing =
    false;

  lastPoint =
    null;

}



/* --------------------------
   CLEAR
--------------------------- */

function clearArt() {

  art.clearRect(
    0,
    0,
    W,
    H
  );

  render();

}



/* --------------------------
   FILL
--------------------------- */

function fillMango() {

  clipMango();

  art.fillStyle =
    currentColor;

  mangoPath(art);

  art.fill();

  unclipMango();

  render();

}



/* --------------------------
   RANDOM DESIGN
--------------------------- */

function randomFrom(arr) {

  return arr[
    Math.floor(
      Math.random()
      *
      arr.length
    )
  ];

}



function surpriseMe() {

  clearArt();


  baseColor.value =
    randomFrom([
      "#ffc928",
      "#ff9c2a",
      "#ffcf4d",
      "#f5b82e",
      "#ff7c35"
    ]);


  render();


  for(
    let i = 0;
    i < 4;
    i++
  ){

    currentColor =
      randomFrom(
        palette.slice(
          0,
          8
        )
      );


    sizeInput.value =
      8 +
      Math.floor(
        Math.random()
        * 8
      );


    drawStripe(
      230 +
      i * 60
    );

  }


  for(
    let i = 0;
    i < 12;
    i++
  ){

    currentColor =
      randomFrom(
        palette.slice(
          0,
          8
        )
      );


    const x =
      275 +
      Math.random()
      * 190;


    const y =
      190 +
      Math.random()
      * 280;


    if(
      insideMango(
        x,
        y
      )
    ){

      if(
        Math.random()
        > .5
      )

        drawHeart(
          x,
          y
        );

      else

        drawFlower(
          x,
          y
        );

    }

  }


  sizeLabel.textContent =
    sizeInput.value;

}



/* --------------------------
   DOWNLOAD
--------------------------- */

function downloadPNG() {

  render();


  const link =
    document.createElement(
      "a"
    );


  link.download =
    "my-mango.png";


  link.href =
    canvas.toDataURL(
      "image/png"
    );


  link.click();

}



/* --------------------------
   PALETTE
--------------------------- */

palette.forEach(
  color => {

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "swatch";


    button.dataset.color =
      color;


    button.style.background =
      color;


    button.addEventListener(
      "click",
      function(){

        setColor(
          color
        );

      }
    );


    paletteEl.appendChild(
      button
    );

  }
);



/* --------------------------
   TOOL BUTTONS
--------------------------- */

document
.querySelectorAll(
  ".tool"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        setTool(
          button.dataset.tool
        );

      }
    );

  }
);



sizeInput.addEventListener(
  "input",
  function(){

    sizeLabel.textContent =
      sizeInput.value;

  }
);



colorPicker.addEventListener(
  "input",
  function(e){

    setColor(
      e.target.value
    );

  }
);



baseColor.addEventListener(
  "input",
  render
);



document
.getElementById(
  "clearArt"
)
.addEventListener(
  "click",
  clearArt
);



document
.getElementById(
  "fillMango"
)
.addEventListener(
  "click",
  fillMango
);



document
.getElementById(
  "surprise"
)
.addEventListener(
  "click",
  surpriseMe
);



document
.getElementById(
  "download"
)
.addEventListener(
  "click",
  downloadPNG
);



/* --------------------------
   POINTER EVENTS
--------------------------- */

canvas.addEventListener(
  "pointerdown",
  function(e){

    startDrawing(
      getPoint(e)
    );

    e.preventDefault();

  }
);


canvas.addEventListener(
  "pointermove",
  function(e){

    moveDrawing(
      getPoint(e)
    );

    e.preventDefault();

  }
);


canvas.addEventListener(
  "pointerup",
  function(e){

    endDrawing();

    e.preventDefault();

  }
);


canvas.addEventListener(
  "pointercancel",
  endDrawing
);


window.addEventListener(
  "pointerup",
  endDrawing
);



/* --------------------------
   INITIALIZE
--------------------------- */

setColor(
  currentColor
);

setTool(
  currentTool
);

render();

})();

</script>

</body>
</html>
